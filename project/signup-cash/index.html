<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BolaCash - SignUp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="signup-container">
    <div class="form-card">
      <img src="BOLA CASH LOGO.png">
      <h2>Create Your Account</h2>
      <p class="subtitle">Join the movement and start building a cleaner, greener future today.</p>

      <form action="#" method="POST" class="signup-form">
        <div class="input-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname"  required>
        </div>

        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email"  required>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password"  required>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="terms" required>
          <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</label>
        </div>

        <button type="submit" class="btn-submit">Create Account</button>
      </form>

      <p class="footer-text">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </main>

</body>
</html>
