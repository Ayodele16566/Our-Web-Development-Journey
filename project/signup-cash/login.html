<body>
  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BolaCash - SignUp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="signup-container">
    <div class="form-card">
      <img src="BOLA CASH LOGO.png">
      <h2>Login your Account</h2>
      <p class="subtitle">Join the movement and start building a cleaner, greener future today.</p>

      <form action="#" method="POST" class="signup-form">
       

        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email"  required>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password"  required>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="terms" required>
          <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</label>
        </div>

        <button type="submit" class="btn-submit">Create Account</button>
      </form>

      <p class="footer-text">Don't have an account? <a href="index.html">Sign up</a></p>
      <p class="footer-text"><a href="../bola.html">Back to Home Page</a></p>
    </div>
  </main>

</body>
</html>
</body>
</html>
